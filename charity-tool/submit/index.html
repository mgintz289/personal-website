<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width">
<title>Submit Charity Metric Data - Michael Gintz</title>
<link rel="stylesheet" href="../../css/style.css" type="text/css"/>
<!--<link rel="shortcut icon" href="favicon.png">-->
</head>
<body>
<header>
<h1 id="name" style="padding-bottom:0px;">Michael Gintz</h1>
<h3 id="name"style="padding-top:0px;">Submit Charity Metric Data</h3>
</header>
<div id="eight">
<div id="whitebox">
Help me gather charity data! Here's a helpful guide.
<form id="locationForm" style="margin-top:10px">
  <div class="form-grid">
    <span>Charity name:</span>
    <input type="text" id="charityname" required />

    <div id="metrics-container" class="loading">
      <div class="metric-group">
        <span>Relevant metric: </span>
        <div class="dropdown-row">
          <select class="category" name="cat" required>
            <option value="">(please select a category)</option>
          </select>
          <select class="subcategory" name="subcat" style="display:none" required>
            <option value="">(please select a subcategory)</option>
          </select>
          <select class="outcome" name="outcome" style="display:none" required>
            <option value="">(please select an outcome)</option>
          </select>
        </div>

        <span>Actual metric:</span>
        <select class="metric-type" name="metrictype" required>
          <option value="Stated">Stated metric</option>
          <option value="Research">Associated research metric</option>
          <option value="Advocacy">Associated advocacy metric</option>
        </select>

        <span>Metric value:</span>
        <input class="metric-value" pattern="^\d*\.?\d+$" required/>

        <span></span>
        <button type="button" class="remove-metric" style="display:none">Remove metric</button>
      </div>
    </div>
  </div>
  <button type="button" id="new-metric">Add another metric</button><br>
  <button type="submit" id="button-submit">Submit</button>
</form>
<div id="more"><div id="space"></div><a href="../">go back</a></div>
</div>
</div>
</body>
<script src="script.js"></script>
</html>
